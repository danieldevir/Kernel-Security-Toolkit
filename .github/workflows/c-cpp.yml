name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc make
    
    - name: Compile PoC examples
      run: |
        cd scripts/poc_examples
        gcc -o null_pointer_poc null_pointer_poc.c
        gcc -o deadlock_poc deadlock_poc.c -lpthread
    
    - name: Run PoC checks
      run: |
        cd scripts/poc_examples
        ./null_pointer_poc || true
        timeout 2s ./deadlock_poc || true
